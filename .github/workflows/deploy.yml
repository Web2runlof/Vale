<CodeBlock language="yaml" editable>
name: Publicar Vale en GitHub Pages

on:
push:
branches:
- main
workflow_dispatch:
permissions:
contents: read
pages: write
id-token: write
concurrency:
group: github-pages
cancel-in-progress: true
jobs:
deploy:
runs-on: ubuntu-latest
environment:
name: github-pages
url: ${{ steps.deployment.outputs.page_url }}
steps:
- name: Descargar repositorio
uses: actions/checkout@v4
- name: Instalar Bun
uses: oven-sh/setup-bun@v2
with:
bun-version: latest
- name: Instalar dependencias desde bun.lock
run: bun install --frozen-lockfile
- name: Compilar React y Vite para GitHub Pages
run: bun run build
env:
GITHUB_PAGES: 'true'
- name: Comprobar archivos de salida
run: |
test -f dist/index.html
test -d dist/assets
- name: Configurar GitHub Pages
uses: actions/configure-pages@v5
- name: Subir sitio compilado
uses: actions/upload-pages-artifact@v4
with:
path: ./dist
- name: Publicar sitio web
id: deployment
uses: actions/deploy-pages@v4
</CodeBlock>
